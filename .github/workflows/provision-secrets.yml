name: Provision production secrets

on:
  workflow_dispatch:
    inputs:
      cookie_secret:
        description: EVE_TRADER_COOKIE_SECRET
        required: true
        type: string
      token_key:
        description: EVE_TRADER_TOKEN_KEY
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" > ~/.ssh/known_hosts
      - name: Install secrets without logging values
        env:
          VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          VM_USER: ${{ vars.PRODUCTION_VM_USER }}
          COOKIE_SECRET: ${{ inputs.cookie_secret }}
          TOKEN_KEY: ${{ inputs.token_key }}
        run: |
          set -euo pipefail
          {
            printf '%s' "$COOKIE_SECRET" | base64 -w0
            printf '\n'
            printf '%s' "$TOKEN_KEY" | base64 -w0
            printf '\n'
          } | ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'sudo /usr/local/sbin/eve-trader-secrets'
          unset COOKIE_SECRET TOKEN_KEY
