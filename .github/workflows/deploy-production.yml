name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable candidate tag to deploy (candidate-<40-hex-sha>)
        required: true
        type: string
      rollback:
        description: Previously deployed immutable tag to restore (optional)
        required: false
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy and verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image tag
        env:
          IMAGE: ${{ inputs.image }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          [ "$(printf '%s' "$IMAGE" | sed -n 's/^candidate-[0-9a-f]\{40\}$/ok/p')" = "ok" ] || {
            printf 'image must be candidate-<40-hex-sha>, got %s\n' "$IMAGE" >&2
            exit 1
          }
          if [ -n "$ROLLBACK" ]; then
            [ "$(printf '%s' "$ROLLBACK" | sed -n 's/^candidate-[0-9a-f]\{40\}$/ok/p')" = "ok" ] || {
              printf 'rollback must be candidate-<40-hex-sha>, got %s\n' "$ROLLBACK" >&2
              exit 1
            }
          fi
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
        run: bash .github/scripts/setup-ssh.sh
      - name: Deploy immutable image
        id: deploy
        env:
          VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          VM_USER: ${{ vars.PRODUCTION_VM_USER }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          out=$(ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            "sudo /usr/local/sbin/eve-trader-deploy '$IMAGE' '${ROLLBACK:-}'")
          printf '%s\n' "$out"
          deployed=$(printf '%s\n' "$out" | sed -n 's/^deployed=//p' | tail -n 1)
          [ -n "$deployed" ]
          printf 'deployed=%s\n' "$deployed" >> "$GITHUB_OUTPUT"
      - name: Verify public HTTPS routes
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          VM_USER: ${{ vars.PRODUCTION_VM_USER }}
          IMAGE: ${{ steps.deploy.outputs.deployed }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          passed=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            health=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$URL/healthz" || true)
            homepage=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$URL/" || true)
            if [ "$health" = "ok" ] && [ -n "$homepage" ]; then
              passed=1
              break
            fi
            sleep 5
          done
          if [ "$passed" = "1" ]; then
            printf 'health-check=passed url=%s approver=%s timestamp=%s target=%s image=%s\n' \
              "$URL" "$APPROVER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VM_HOST" "$IMAGE"
            exit 0
          fi
          printf 'health-check=failed url=%s approver=%s timestamp=%s target=%s image=%s\n' \
            "$URL" "$APPROVER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VM_HOST" "$IMAGE"
          prev=$(ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" 'sudo cat /var/lib/eve-trader/previous-image' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" "sudo /usr/local/sbin/eve-trader-deploy '$prev'" || true
          fi
          printf 'rollback=%s\n' "$prev"
          exit 1
