name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Scope the minted token down to exactly what release-please
          # needs, rather than the App's full blanket installation
          # permissions (the default without these).
          permission-contents: write
          permission-pull-requests: write

      # Uses the App's installation token, not the default GITHUB_TOKEN:
      # GitHub suppresses further workflow triggers from tags/pushes made
      # with the default token, which would silently stop the tag this
      # creates from ever kicking off release.yml's build.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
