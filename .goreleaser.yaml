version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: eve-trader
    main: ./cmd/eve-trader
    binary: eve-trader
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64

# No binary archives/GitHub release assets -- this ships as a Docker image
# only (see the parent issue: "adapted for a Docker image instead of
# distributed binaries").
archives:
  - id: eve-trader
    formats: [none]

# dockers (v1) is being phased out in favor of dockers_v2 -- no reason to
# start a new project on the deprecated form.
dockers_v2:
  - id: eve-trader
    ids:
      - eve-trader
    dockerfile: Dockerfile
    images:
      - "ghcr.io/mgoodness/eve-trader"
    tags:
      # stable: floating, the tag Watchtower on the VM polls for
      # redeploys, updated on every push to main (see ADR-0008 --
      # no version tags/gated releases). ShortCommit: immutable, for
      # pinning/rollback -- .Tag isn't used since there's no git tag
      # in this nightly-build pipeline.
      - "stable"
      - "{{ .ShortCommit }}"
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.source": "https://github.com/mgoodness/eve-trader"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"

# No version tags and no GitHub Release in this pipeline (see ADR-0008) --
# just build + push the Docker image on every push to main. disable: true
# suppresses release creation regardless of the --nightly flag deploy.yml
# invokes GoReleaser with.
release:
  disable: true
