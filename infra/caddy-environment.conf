# Systemd drop-in for the Debian/Cloudsmith Caddy package. The packaged unit
# does not read /etc/default/caddy, so install this as
# /etc/systemd/system/caddy.service.d/override.conf to expose
# EVE_TRADER_DOMAIN to the Caddyfile's {$EVE_TRADER_DOMAIN} placeholder
# (docs/deployment.md).
[Service]
EnvironmentFile=/etc/default/caddy
