{{define "styles"}}<style>
  body { font-family: system-ui, sans-serif; background: #0b1120; color: #e2e8f0; margin: 0; padding: 0 1.5rem 3rem; }
  header { border-bottom: 1px solid #1e293b; padding: 1.5rem 0; }
  h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
  .nav { display: flex; gap: 1rem; margin-top: .75rem; font-size: .85rem; }
  .nav a { color: #64748b; text-decoration: none; padding-bottom: .15rem; }
  .nav a:hover { color: #e2e8f0; }
  .nav a.active { color: #34d399; font-weight: 600; border-bottom: 2px solid #34d399; }
  .footnote { color: #94a3b8; font-size: .8rem; margin: 0; }
  .reauth { min-height: 60vh; display: grid; place-items: center; text-align: center; }
  .reauth a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .35rem; background: #34d399; color: #06251b; font-weight: 700; text-decoration: none; }
</style>{{end}}
