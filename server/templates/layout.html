{{define "layout"}}<div class="layout">
  <aside class="sidebar">
    <section class="card" aria-labelledby="filters-title">
      <h2 id="filters-title">Your filters</h2>
      <form id="filterform" method="get" action="/">
        <input type="hidden" name="sort" value="{{.Sort}}">
        <label class="control">Minimum daily volume<span class="help" title="Hide items whose average daily Heimatar volume is below this. Default 20 keeps dead markets out; clear it for no lower bound.">?</span>
          <input type="text" inputmode="decimal" name="minvol" value="{{.FilterForm.MinVolume}}" title="Hide items whose average daily Heimatar volume is below this. Default 20 keeps dead markets out; clear it for no lower bound.">
        </label>
        <label class="control">Minimum gross margin %<span class="help" title="Hide items whose gross margin is below this. Gross margin is (sell - buy) / sell. Default 7%; clear it for no lower bound.">?</span>
          <input type="text" inputmode="decimal" name="minmargin" value="{{.FilterForm.MinMargin}}" title="Hide items whose gross margin is below this. Gross margin is (sell - buy) / sell. Default 7%; clear it for no lower bound.">
        </label>
        <label class="control">Maximum gross margin %<span class="help" title="Hide items whose gross margin is above this - usually a stale or manipulated price. Default 60%; clear it for no upper bound.">?</span>
          <input type="text" inputmode="decimal" name="maxmargin" value="{{.FilterForm.MaxMargin}}" title="Hide items whose gross margin is above this - usually a stale or manipulated price. Default 60%; clear it for no upper bound.">
        </label>
        <label class="control">Maximum sell price<span class="help" title="Hide items whose sell price is above this, to cap what you must spend to acquire them. Blank means no cap.">?</span>
          <input type="text" inputmode="decimal" name="maxsell" value="{{.FilterForm.MaxSell}}" placeholder="no cap" title="Hide items whose sell price is above this, to cap what you must spend to acquire them. Blank means no cap.">
        </label>
        <div class="actions">
          <button type="submit">Apply</button>
          <a href="/">Reset</a>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="realism-title">
      <h2 id="realism-title">Always-on realism filters</h2>
      <p class="card-note">Cannot be turned off. Hidden by realism filters: <strong>{{.HiddenByRealism}}</strong>.</p>
      <ul class="rules">
        {{range .RealismRules}}<li>{{.}}</li>{{end}}
      </ul>
    </section>
  </aside>

  <section class="results" id="results">
    <p class="summary">{{template "summary" .}}</p>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          {{range .Columns}}<th class="{{if .Active}}active{{end}}" hx-get="{{.Href}}" hx-target="#layout" hx-swap="innerHTML" hx-push-url="{{.Push}}">{{.Label}}</th>{{end}}
        </tr>
      </thead>
      <tbody id="rows">
        {{template "rows" .}}
      </tbody>
    </table>
  </section>
</div>{{end}}
